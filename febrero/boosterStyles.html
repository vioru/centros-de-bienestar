<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    /* Slider */
    .slider-container {
        position: relative;
        width: 100%;
        overflow: hidden;
    }

    .slider-track {
        display: flex;
        transition: transform 0.8s ease-in-out;
        width: 500%;
        touch-action: pan-x pinch-zoom;
        -webkit-user-select: none;
        user-select: none;
    }

    .slide {
        width: 20%;
        flex-shrink: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .slide img {
        max-height: 420px;
        width: 100%;
        object-fit: cover;
    }

    .slider-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: white;
        border: none;
        cursor: pointer;
        padding: 4px 5px;
        z-index: 2;
        border-radius: 50%
    }

    .slider-arrow svg {
        width: 20px;
        height: 20px;
        color: #007078;
    }

    .slider-arrow.prev {
        left: 10px;
    }

    .slider-arrow.next {
        right: 10px;
    }

    /* Contenedor padre */
    .medipielsa-components-0-x-containerSection.w-100.mw9.center {
        display: flex;
        padding: 1rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .contenedor-cb-interno {
        padding: 1.5rem;
    }

    .contenedor-cb-interno h1 {
        font-size: 1.5rem;
        font-weight: 600;
        font-family: 'Montserrat', sans-serif;
        color: #007078;
        text-transform: uppercase;
    }

    .contenedor-cb-interno .precio-servicio {
        font-size: 1.3rem;
        color: #007078;
        margin: 0.5rem 0rem;
        font-weight: bold;
        font-family: 'Montserrat', sans-serif;
    }

    .contenedor-cb-interno p {
        margin: 1rem 0rem;
        color: #767575;
    }

    .contenedor-cb-interno .btn-agendar {
        width: 25%;
        margin-top: 2rem;
    }

    /* Button used to open the contact form - fixed at the bottom of the page */
    .open-button {
        cursor: pointer;
        border: none;
    }

    .content-btn-schedule a {
        color: #000;
        text-align: center;
        border: 2px solid #007078;
        margin: 0.5rem;
        padding: 0.5rem;
        border-radius: 10px;
        transition: all 0.5s;
        display: block;
        font-weight: 500;
    }

    .content-btn-schedule a:hover {
        color: #fff;
        background-color: #007078;
    }

    /* Acordeón */
    .contenedor-servicios-acordeon .accordion {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 98%;
        height: auto;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0 auto;
    }

    .accordion-toggle,
    .accordion-header {
        font-size: 15px;
        width: 100%;
        height: 3em;
        margin: 0;
        line-height: 3em;
        cursor: pointer;
    }

    .accordion-toggle {
        opacity: 0;
        background-color: transparent;
        z-index: 1;
        margin-bottom: 2px;
        position: relative;
    }

    .accordion-header {
        background-color: #ffffff;
        color: #7f8787;
        position: relative;
        margin-top: -3em;
        padding-left: 10px;
        border-bottom: 1px solid #dedede;
    }

    .accordion-header h2 {
        color: #007078;
        visibility: visible;
        position: absolute;
        top: 0;
        left: 1em;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 1.2rem;
    }

    .accordion-content {
        box-sizing: border-box;
        color: #767575;
        overflow: hidden;
        position: relative;
        width: 100%;
        max-height: 0;
        transition: max-height 0.3s ease;
        background: #fff;
        padding: 0 1.5rem;
    }

    .accordion-toggle:checked+.accordion-header+.accordion-content {
        max-height: 1000px;
        padding: 1.5rem;
    }

    .accordion-header::before {
        content: '+';
        display: inline-block;
        text-align: center;
        color: #007078;
        font-size: 2rem;
        position: absolute;
        right: 0.5rem;
    }

    .accordion-toggle:checked+.accordion-header::before {
        content: '-';
    }

    .accordion-toggle:hover+.accordion-header {
        background-color: #F5E5DC;
    }

    .accordion-toggle:checked+.accordion-header {
        background-color: #F5E5DC;
    }

    .accordion-content ul li {
        padding: 0.3rem 0rem;
        list-style: none;
    }

    .accordion-content ul li h3 {
        font-size: 1rem;
        font-weight: normal;
    }

    .accordion-content p {
        padding: 0.2rem 0rem;
    }

    .contenedor-servicios-acordeon {
        margin-bottom: 2rem;
    }

    .check-icon {
        font-weight: bold;
        margin-right: 0.5rem;
    }

    /* Aparatología */
    .contenedor-aparatologia {
        width: 98%;
        margin: 1.5rem auto;
    }

    .contenedor-aparatologia h2 {
        color: #007078;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 1.2rem;
        padding: 0.7rem 1rem;
        background-color: #F5E5DC;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .contenedor-aparatologia .flex {
        /*justify-content: center;*/
        align-items: center;
    }

    .contenedor-aparatologia .w-25 {
        padding: 0.5rem;
    }

    .contenedor-aparatologia h3 {
        color: #007078;
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        margin: 0.3rem 0rem;
    }

    .contenedor-aparatologia p {
        font-size: 0.95rem;
        color: #767575;
    }

    /* Mobile */
    @media (max-width:768px) {
        .slider-container {
            width: 100%;
            touch-action: pan-x;
        }

        .slider-arrow svg {
            width: 16px;
            height: 16px;
        }

        .content-brand {
            width: 100%;
        }

        .contenedor-cb-interno {
            padding: 0.8rem;
        }

        .contenedor-cb-interno .btn-agendar {
            width: 50%;
            margin: 2rem auto;
        }

        .contenedor-cb-interno h1 {
            margin-top: 0rem;
        }

        .accordion-content {
            max-height: 0;
            padding: 0 1rem;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        .accordion-toggle:checked+.accordion-header+.accordion-content {
            max-height: 2000px;
            padding: 1rem;
        }

        .accordion-content ul li {
            padding: 0.5rem 0;
        }

        .contenedor-aparatologia .flex {
            flex-wrap: wrap;
        }

        .contenedor-aparatologia .w-25 {
            width: 50%;
            padding: 0.3rem;
        }

        .contenedor-aparatologia .w-50 {
            width: 100%;
            padding: 0.3rem;
        }

        .contenedor-aparatologia iframe {
            width: 100% !important;
            height: 300px !important;
            margin-top: 1.2rem;
        }
    }

    /* Slider personalizado */
    .medipiel-slider-container {
        position: relative;
        width: 100%;
        overflow: hidden;
        max-height: 420px;
    }

    .medipiel-slider {
        display: flex;
        transition: transform 0.8s ease-in-out;
        width: 100%;
    }

    .slide-item {
        width: 100%;
        flex-shrink: 0;
        display: none; 
    }

    
    .slide-item:first-child {
        display: block;
    }

    
    .medipiel-slider.initialized .slide-item {
        display: block;
    }

    .slide-content {
        width: 100%;
        height: 100%;
    }

    .slide-image {
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        display: block;
    }

    .slider-nav {
        position: absolute;
        top: 50% !important;
        transform: translateY(-50%);
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
        pointer-events: none;
    }

    .slider-prev,
    .slider-next {
        background: white;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        pointer-events: auto;
        z-index: 2;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .slider-prev svg,
    .slider-next svg {
        color: #007078;
        width: 20px;
        height: 20px;
    }
</style>
